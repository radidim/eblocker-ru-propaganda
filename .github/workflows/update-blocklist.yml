name: Update eBlocker RU-Propaganda blocklist

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run merge script
        run: python3 scripts/update_blocklist.py

      - name: Commit and push if changed
        run: |
          git config user.name "eblocker-blocklist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/blocklist.txt output/STATS.md
          if git diff --cached --quiet; then
            echo "Няма промени в списъка."
          else
            git commit -m "chore: auto-update blocklist ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
